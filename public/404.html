<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forsaken Souls: ReMaster</title>
    <script>
      // O GitHub Pages não possui fallback de SPA: rotas diretas (ex.: /capitulo-1)
      // retornam 404. Esta página redireciona para o index.html preservando o
      // caminho original na query string (?/caminho), que é restaurado lá.
      var pathSegmentsToKeep = 1; // /<usuario>/<repo>/...
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
